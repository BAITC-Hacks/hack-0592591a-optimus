[project]
name = "orgscope-extractor"
version = "0.1.0"
description = "Extracts traceable text fragments from Word, PDF and Excel documents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
