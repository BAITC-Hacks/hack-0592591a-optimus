# The whole system. ONE file, ONE version, used unchanged by developers, the VM
# and the judges:
#   cp .env.example .env && docker compose up --build
# Environments differ only by .env values (ports, SITE_ADDRESS, keys).
name: hackalem

services:
  # Single public entrypoint. SITE_ADDRESS=":80" serves plain HTTP (local, judges).
  # A real hostname (the VM) makes Caddy obtain a Let's Encrypt certificate.
  caddy:
    build:
      context: .
      dockerfile: services/caddy/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_PORT:-3000}:80"
      - "${HTTPS_PORT:-3443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 12

    develop:
      watch:
        - action: rebuild
          path: ./Caddyfile
        - action: rebuild
          path: ./services/caddy

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Node.js + Express API, routed by Caddy at /api/*.
  backend:
    build: ./services/backend
    restart: unless-stopped
    environment:
      PORT: "8000"
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/hackalem}
      EXTRACTOR_URL: http://extractor:8001
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@example.com}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo12345}
      DEMO_USER_NAME: ${DEMO_USER_NAME:-Демо}
    depends_on:
      mongo:
        condition: service_healthy
      extractor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    develop:
      watch:
        - action: rebuild
          path: ./services/backend

  # Internal document extraction (Word/PDF/Excel -> traceable fragments).
  # Python, because python-docx/pdfplumber/openpyxl are the most capable parsers.
  # Not routed by Caddy: only the backend calls it.
  extractor:
    build: ./services/extractor
    restart: unless-stopped
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    develop:
      watch:
        - action: rebuild
          path: ./services/extractor

  # Vue 3 + Vite, built to static files and served by a small Caddy container.
  frontend:
    build: ./services/frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 12
    develop:
      watch:
        - action: rebuild
          path: ./services/frontend

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
