# The whole system. ONE file, ONE version, used unchanged by developers, the VM
# and the judges:
#   cp .env.example .env && docker compose up --build
# Environments differ only by .env values (ports, SITE_ADDRESS, keys).
name: hackalem

services:
  # Single public entrypoint. SITE_ADDRESS=":80" serves plain HTTP (local, judges).
  # A real hostname (the VM) makes Caddy obtain a Let's Encrypt certificate.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_PORT:-3000}:80"
      - "${HTTPS_PORT:-3443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 12

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Node.js + Express API, routed by Caddy at /api/*.
  backend:
    build: ./services/backend
    restart: unless-stopped
    environment:
      PORT: "8000"
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/hackalem}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    develop:
      watch:
        - action: rebuild
          path: ./services/backend

  # Vue 3 + Vite, built to static files and served by a small Caddy container.
  frontend:
    build: ./services/frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 12
    develop:
      watch:
        - action: rebuild
          path: ./services/frontend

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
